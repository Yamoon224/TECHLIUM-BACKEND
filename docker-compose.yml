name: TechLium

services:
  mysql:
    image: mysql:8.0
    container_name: TechLium-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: TechLium
      MYSQL_USER: TechLium
      MYSQL_PASSWORD: TechLium
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - TechLium-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: TechLium-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - TechLium-redis:/data

  meilisearch:
    image: getmeili/meilisearch:v1.10
    container_name: TechLium-meilisearch
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: TechLium_dev_master_key
      MEILI_ENV: development
    ports:
      - "7700:7700"
    volumes:
      - TechLium-meilisearch:/meili_data

  mailpit:
    image: axllent/mailpit:latest
    container_name: TechLium-mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"

volumes:
  TechLium-mysql:
  TechLium-redis:
  TechLium-meilisearch:
