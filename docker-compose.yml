name: TechniLium

services:
  mysql:
    image: mysql:8.0
    container_name: TechniLium-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: TechniLium
      MYSQL_USER: TechniLium
      MYSQL_PASSWORD: TechniLium
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - TechniLium-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: TechniLium-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - TechniLium-redis:/data

  meilisearch:
    image: getmeili/meilisearch:v1.10
    container_name: TechniLium-meilisearch
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: TechniLium_dev_master_key
      MEILI_ENV: development
    ports:
      - "7700:7700"
    volumes:
      - TechniLium-meilisearch:/meili_data

  mailpit:
    image: axllent/mailpit:latest
    container_name: TechniLium-mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"

volumes:
  TechniLium-mysql:
  TechniLium-redis:
  TechniLium-meilisearch:
